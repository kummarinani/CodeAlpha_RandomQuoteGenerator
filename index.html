<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Quote of the Moment</h1>
        <p class="subtitle">A little inspiration for your day</p>

        <div class="quote-card">
            <div class="quote-mark">“</div>

            <p id="quote">Your quote will appear here.</p>

            <p id="author">— Author</p>

            <button id="newQuoteBtn">New Quote ↗</button>
        </div>

        <footer>Made with ❤️ using HTML, CSS & JavaScript</footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
